[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "extended-dtmf"
version = "0.1.0"
description = "Extended DTMF encoder/decoder supporting the full LATIN-1 character set"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0"
]

[project.entry-points."console_scripts"]
dtmf = "extended_dtmf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["extended_dtmf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=extended_dtmf"